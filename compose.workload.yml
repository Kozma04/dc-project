services:
  workload_power_meter_01:
    build: ./publishers
    image: dc-project-publisher:local
    restart: "no"
    depends_on:
      - mosquitto
    cap_add:
      - NET_ADMIN
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      DEVICE_ID: power_meter_01
      DEVICE_INDEX: "1"
      RUN_SEED: "${RUN_SEED:-101}"
      ROOM: livingroom
      SENSOR_TYPE: power
      PUBLISH_INTERVAL: "1.0"
      PUBLISH_QOS: "${PUBLISH_QOS:-0}"
      LOAD_MODE: "${LOAD_MODE:-steady}"
      LOG_EACH_PUBLISH: "${LOG_EACH_PUBLISH:-false}"

